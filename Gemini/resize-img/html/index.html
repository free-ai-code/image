<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像サイズ変更ツール</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
    }

    .drop-zone {
      border: 2px dashed var(--accent);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      background-color: #eff6ff;
      transition: background-color 0.2s;
    }

    .drop-zone:hover {
      background-color: #dbeafe;
    }

    .controls {
      margin-top: 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .input-row {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .input-row label {
      flex: 1;
    }

    input[type="number"], select {
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .preview-container {
      margin-top: 1.5rem;
      text-align: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>画像サイズ変更ツール</h1>
  
  <div class="drop-zone" id="dropZone">
    <p>ここに画像をドラッグ＆ドロップ<br>またはクリックして選択</p>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>

  <div class="controls">
    <div class="input-row">
      <div class="input-group">
        <label for="width">幅 (px):</label>
        <input type="number" id="width" min="1">
      </div>
      <div class="input-group">
        <label for="height">高さ (px):</label>
        <input type="number" id="height" min="1">
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="keepAspect" checked>
      <label for="keepAspect">縦横比を維持する</label>
    </div>

    <div class="input-group">
      <label for="format">保存形式:</label>
      <select id="format">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WebP</option>
      </select>
    </div>

    <button id="downloadBtn" disabled>変更した画像をダウンロード</button>
  </div>

  <div class="preview-container">
    <canvas id="canvas" style="display: none;"></canvas>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const widthInput = document.getElementById('width');
  const heightInput = document.getElementById('height');
  const keepAspect = document.getElementById('keepAspect');
  const formatSelect = document.getElementById('format');
  const downloadBtn = document.getElementById('downloadBtn');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let originalImage = null;
  let aspectRatio = 1;

  // ファイル選択イベント
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => loadImage(e.target.files[0]));

  // ドラッグ＆ドロップ処理
  dropZone.addEventListener('dragover', (e) => e.preventDefault());
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length > 0) {
      loadImage(e.dataTransfer.files[0]);
    }
  });

  // 画像の読み込み
  function loadImage(file) {
    if (!file || !file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        originalImage = img;
        aspectRatio = img.width / img.height;

        widthInput.value = img.width;
        heightInput.value = img.height;

        updateCanvas();
        downloadBtn.disabled = false;
        canvas.style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 入力変更時のアスペクト比計算
  widthInput.addEventListener('input', () => {
    if (keepAspect.checked && aspectRatio && widthInput.value) {
      heightInput.value = Math.round(widthInput.value / aspectRatio);
    }
    updateCanvas();
  });

  heightInput.addEventListener('input', () => {
    if (keepAspect.checked && aspectRatio && heightInput.value) {
      widthInput.value = Math.round(heightInput.value * aspectRatio);
    }
    updateCanvas();
  });

  // キャンバスの更新
  function updateCanvas() {
    if (!originalImage) return;

    const w = parseInt(widthInput.value) || originalImage.width;
    const h = parseInt(heightInput.value) || originalImage.height;

    canvas.width = w;
    canvas.height = h;

    ctx.drawImage(originalImage, 0, 0, w, h);
  }

  // ダウンロード機能
  downloadBtn.addEventListener('click', () => {
    if (!originalImage) return;

    const format = formatSelect.value;
    const ext = format.split('/')[1];
    const link = document.createElement('a');

    link.download = `resized-image.${ext}`;
    link.href = canvas.toDataURL(format, 0.9);
    link.click();
  });
</script>

</body>
</html>
