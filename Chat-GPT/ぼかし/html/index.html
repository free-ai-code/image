<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #111;
      color: #eee;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    input, button, label {
      display: block;
      width: 100%;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
    canvas {
      display: block;
      max-width: 100%;
      margin-top: 16px;
      background: #222;
    }
    a {
      display: inline-block;
      margin-top: 10px;
      color: #60a5fa;
    }
    .box {
      background: #1f1f1f;
      padding: 12px;
      border-radius: 8px;
    }
    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <input type="file" id="fileInput" accept="image/*">

      <div class="row">
        <label>
          ぼかしの強さ
          <input type="range" id="blurRange" min="0" max="30" value="8">
        </label>
        <label>
          数値
          <input type="number" id="blurNum" min="0" max="30" value="8">
        </label>
      </div>

      <button id="applyBtn">ぼかしをかける</button>
      <a id="downloadLink" style="display:none;" download="blur.png">画像をダウンロード</a>
    </div>

    <canvas id="canvas"></canvas>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const blurRange = document.getElementById('blurRange');
    const blurNum = document.getElementById('blurNum');
    const applyBtn = document.getElementById('applyBtn');
    const downloadLink = document.getElementById('downloadLink');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let originalImage = null;

    blurRange.addEventListener('input', () => {
      blurNum.value = blurRange.value;
    });

    blurNum.addEventListener('input', () => {
      blurRange.value = blurNum.value;
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          downloadLink.style.display = 'none';
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    function applyBlur(img, blurValue) {
      canvas.width = img.width;
      canvas.height = img.height;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.filter = `blur(${blurValue}px)`;
      ctx.drawImage(img, 0, 0);
      ctx.filter = 'none';

      return canvas.toDataURL('image/png');
    }

    applyBtn.addEventListener('click', () => {
      if (!originalImage) {
        alert('画像を選択してください');
        return;
      }

      const blurValue = parseInt(blurRange.value, 10) || 0;
      const dataUrl = applyBlur(originalImage, blurValue);

      downloadLink.href = dataUrl;
      downloadLink.style.display = 'inline-block';
    });
  </script>
</body>
</html>
