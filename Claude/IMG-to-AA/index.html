<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アスキーアート（AA）変換器</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        h1 {
            text-align: center;
            color: #333;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        
        input[type="file"],
        input[type="range"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        button:active {
            background: #004085;
        }
        
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 10px;
            border-radius: 4px;
        }
        
        #output {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            line-height: 1;
            font-size: 10px;
            min-height: 200px;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre;
        }
        
        #canvas {
            display: none;
        }
        
        .info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        
        .range-value {
            display: inline-block;
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 3px;
            margin-left: 10px;
            font-weight: bold;
        }
        
        button.copy-btn {
            background: #28a745;
            margin-top: 10px;
        }
        
        button.copy-btn:hover {
            background: #218838;
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>アスキーアート（AA）変換器</h1>
    
    <div class="container">
        <div class="panel">
            <h2>入力設定</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="imageInput">画像をアップロード:</label>
                    <input type="file" id="imageInput" accept="image/*">
                    <img id="preview" alt="プレビュー">
                </div>
                
                <div class="control-group">
                    <label for="widthRange">幅（文字数）: <span class="range-value" id="widthValue">100</span></label>
                    <input type="range" id="widthRange" min="20" max="200" value="100">
                </div>
                
                <div class="control-group">
                    <label for="contrastRange">コントラスト: <span class="range-value" id="contrastValue">1.0</span></label>
                    <input type="range" id="contrastRange" min="0.5" max="3" step="0.1" value="1.0">
                </div>
                
                <div class="control-group">
                    <label for="charsetSelect">文字セット:</label>
                    <select id="charsetSelect">
                        <option value="standard">標準 （暗→明）</option>
                        <option value="detailed">詳細 （より多くの段階）</option>
                        <option value="simple">シンプル</option>
                        <option value="block">ブロック</option>
                    </select>
                </div>
                
                <button id="convertBtn">変換</button>
                <p class="info">JPG, PNG, GIF などの画像をアップロードしてください</p>
            </div>
        </div>
        
        <div class="panel">
            <h2>出力</h2>
            <div id="output"></div>
            <button class="copy-btn" id="copyBtn">コピー</button>
        </div>
    </div>
    
    <canvas id="canvas"></canvas>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const convertBtn = document.getElementById('convertBtn');
        const output = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');
        const widthRange = document.getElementById('widthRange');
        const widthValue = document.getElementById('widthValue');
        const contrastRange = document.getElementById('contrastRange');
        const contrastValue = document.getElementById('contrastValue');
        const charsetSelect = document.getElementById('charsetSelect');

        // 文字セット定義
        const charsets = {
            standard: '@%#*+=-:. ',
            detailed: '@%#*+=-:;.` ',
            simple: '##--  ',
            block: '█▓▒░  '
        };

        // 画像アップロード時の処理
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    preview.src = img.src;
                    convertBtn.disabled = false;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 幅スライダーの更新
        widthRange.addEventListener('input', (e) => {
            widthValue.textContent = e.target.value;
        });

        // コントラストスライダーの更新
        contrastRange.addEventListener('input', (e) => {
            contrastValue.textContent = parseFloat(e.target.value).toFixed(1);
        });

        // 変換処理
        convertBtn.addEventListener('click', () => {
            const file = imageInput.files[0];
            if (!file) {
                alert('画像を選択してください');
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    convertToAscii(img);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function convertToAscii(img) {
            const width = parseInt(widthRange.value);
            const height = Math.floor((img.height / img.width) * width * 0.55); // アスペクト比調整
            
            canvas.width = width;
            canvas.height = height;

            // 画像をキャンバスに描画
            ctx.drawImage(img, 0, 0, width, height);

            // ピクセルデータを取得
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // 文字セットを選択
            const charset = charsets[charsetSelect.value];
            const contrast = parseFloat(contrastRange.value);

            let ascii = '';
            for (let i = 0; i < data.length; i += 4) {
                if ((i / 4) % width === 0) {
                    ascii += '\n';
                }

                // グレースケール化
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                let gray = r * 0.299 + g * 0.587 + b * 0.114;

                // コントラスト調整
                gray = Math.min(255, Math.max(0, (gray - 128) * contrast + 128));

                // 正規化（0-1）
                const normalized = gray / 255;

                // 文字を選択
                const charIndex = Math.floor(normalized * (charset.length - 1));
                ascii += charset[charIndex];
            }

            output.textContent = ascii;
        }

        // コピーボタン
        copyBtn.addEventListener('click', () => {
            const text = output.textContent;
            if (!text) {
                alert('コピーする内容がありません');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'コピーしました';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        });
    </script>
</body>
</html>
